name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, Monday 05:17 UTC.
  #
  # The build-mainline job resolves the newest kernel.org stable and longterm
  # releases at run time, so what it tests changes without anyone touching
  # this repository — and on a push-only trigger a quiet week means no signal
  # at all. A new LTS that breaks the build is a hard failure worth an email
  # the week it lands, not whenever the next commit happens to arrive.
  #
  # Monday because Linus cuts releases on Sunday. Off the hour because
  # scheduled runs cluster (and get delayed) at :00.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # ── Build the kernel module against multiple distro kernels ─────────────
  build:
    name: Build (${{ matrix.os }}, kernel ${{ matrix.kver }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kver: "default"
          - os: ubuntu-24.04
            kver: "default"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        # Via the hardened wrapper: a stalled mirror used to hang apt for the
        # job's entire timeout budget without emitting a single error. The
        # script header has the details.
        run: |
          .github/scripts/apt-install.sh \
            build-essential \
            dkms \
            xz-utils \
            "linux-headers-$(uname -r)"

      - name: Show toolchain
        run: |
          gcc --version | head -1
          make --version | head -1
          uname -a
          ls -la "/lib/modules/$(uname -r)/build" | head -3

      - name: Verify firmware checksums
        run: |
          sha256sum -c CHECKSUMS.sha256

      - name: Build module
        # Without pipefail the pipeline reports tee's status, not make's, so a
        # broken build is caught only by the `test -f` below -- and that misses
        # every failure that still leaves a module on disk. `all:` runs
        # `firmware` and `modules` as independent goals, so under -j make can
        # exit non-zero on the firmware step while modules links 8852au.ko
        # anyway, and the step goes green on a build that failed. The mainline
        # job below has always set this; the distro matrix was the one that did
        # not.
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee build.log
          test -f 8852au.ko

      - name: Module metadata
        # sed rather than head, because head closes the pipe after 40 lines and
        # modinfo has ~160 to write: the next write takes SIGPIPE. That is
        # invisible today only because the pipeline reports head's status, and
        # it turns into exit 141 on every run the moment anyone adds pipefail.
        # sed reads to EOF, so the status is modinfo's -- worth having, since
        # `modinfo` on a missing or unreadable module currently exits 0 and this
        # step passes.
        run: |
          set -euo pipefail
          modinfo ./8852au.ko | sed -n '1,40p'

      - name: Count warnings
        run: |
          warn_count=$(grep -cE "warning:" build.log || true)
          err_count=$(grep -cE "^[^[:space:]].*\.c:[0-9]+:[0-9]+: error:" build.log || true)
          echo "errors=${err_count} warnings=${warn_count}" | tee summary.txt

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-${{ matrix.os }}
          path: |
            8852au.ko
            build.log
            summary.txt
          if-no-files-found: warn
          retention-days: 7

  # ── Build against current mainline kernels (kernel.org) ────────────────
  # The distro-kernel matrix above only exercises the GitHub runner kernel
  # (~6.8-6.11). This job builds against the newest kernel.org stable and
  # longterm releases — resolved at run time, so it tracks 6.19 / 7.0 and
  # beyond automatically — so post-6.18 API breakage is caught in CI rather
  # than by users. Uses `modules_prepare` against a fetched source tree.
  build-mainline:
    name: Build (mainline ${{ matrix.channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The newest stable often outpaces what an out-of-tree vendor driver
    # supports (e.g. kernel 7.1 refactored many cfg80211_ops callbacks from
    # net_device to wireless_dev). The build step treats a stable-channel
    # failure as an informational warning (the job stays green) while longterm
    # (LTS) remains a hard gate. This keeps the branch status clean instead of
    # showing a permanent red X for a known, forward-looking probe.
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, longterm]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        run: |
          .github/scripts/apt-install.sh \
            build-essential bc bison flex libssl-dev libelf-dev xz-utils jq curl

      - name: Resolve ${{ matrix.channel }} kernel version
        id: kver
        run: |
          # --speed-limit/--speed-time abort a transfer that has gone quiet
          # rather than one that is merely slow, which is the failure mode that
          # matters here: a connection that stays open and stops sending. A
          # bare curl waits on that indefinitely, exactly as apt used to.
          #
          # --max-time bounds one attempt, not the sequence, so --retry
          # multiplies it; --retry-max-time is what caps the whole thing. The
          # ceiling here is 40s of retry window plus one final 20s attempt, for
          # a 30 kB file that has never taken a second.
          curl --retry 2 --retry-delay 5 --retry-all-errors --retry-max-time 40 \
            --connect-timeout 15 --max-time 20 \
            --speed-limit 1000 --speed-time 10 \
            -fsSL https://www.kernel.org/releases.json -o releases.json
          if [ "${{ matrix.channel }}" = "stable" ]; then
            ver="$(jq -r '.latest_stable.version' releases.json)"
          else
            ver="$(jq -r '[.releases[] | select(.moniker == "longterm")][0].version' releases.json)"
          fi
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then
            echo "::error::could not resolve ${{ matrix.channel }} kernel version"; exit 1
          fi
          echo "Selected ${{ matrix.channel }} kernel: $ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "major=${ver%%.*}" >> "$GITHUB_OUTPUT"

      - name: Fetch and prepare kernel ${{ steps.kver.outputs.ver }}
        run: |
          ver="${{ steps.kver.outputs.ver }}"
          major="${{ steps.kver.outputs.major }}"
          # --max-time bounds one attempt, not the sequence: with --retry 3 the
          # old 900s ceiling was really (3+1)*900 + 3*5 = 3615s, more than twice
          # this job's own 25-minute limit. Overrunning that limit kills the job
          # rather than the step, and a killed job reports `cancelled`, which
          # sends no notification -- precisely the silence the weekly schedule
          # exists to break. --retry-max-time caps the sequence at 240s of retry
          # window plus one final 120s attempt. The CDN delivers this ~150 MB
          # file in well under 15s, so 120s still admits a mirror running ten
          # times slower than anything yet observed.
          curl --retry 2 --retry-delay 5 --retry-all-errors --retry-max-time 240 \
            --connect-timeout 15 --max-time 120 \
            --speed-limit 10000 --speed-time 30 \
            -fsSL "https://cdn.kernel.org/pub/linux/kernel/v${major}.x/linux-${ver}.tar.xz" -o linux.tar.xz
          tar xf linux.tar.xz
          make -C "linux-${ver}" defconfig
          # The vendored Realtek tree carries many benign code-style warnings
          # (empty-body, etc.). A fresh defconfig builds modules with
          # CONFIG_WERROR=y (distro headers do not), turning those into hard
          # errors. Disable it so this job tests real buildability, not vendor
          # code style. Genuine type breakage (e.g. 7.1's cfg80211
          # incompatible-pointer-types) uses a separate unconditional -Werror
          # and still fails correctly.
          ./linux-${ver}/scripts/config --file "linux-${ver}/.config" --disable WERROR
          make -C "linux-${ver}" olddefconfig
          make -C "linux-${ver}" modules_prepare

      - name: Build module against mainline ${{ steps.kver.outputs.ver }}
        run: |
          ver="${{ steps.kver.outputs.ver }}"
          krel="$(make -s -C "linux-${ver}" kernelrelease)"
          echo "kernelrelease = ${krel}"
          sudo mkdir -p "/lib/modules/${krel}"
          sudo ln -sfn "${PWD}/linux-${ver}" "/lib/modules/${krel}/build"
          # KBUILD_MODPOST_WARN=1: we run modules_prepare, not a full kernel
          # build, so the tree's Module.symvers is empty and modpost cannot
          # resolve in-kernel symbols (memset, usb_alloc_urb, ...). Downgrade
          # that to a warning — this is a compile/link test, and real
          # source-level breakage is already caught in the compile phase
          # before modpost runs.
          # Record which kernel this job actually resolved, whatever the
          # outcome. On the weekly schedule the version moves on its own, so a
          # bare green tick does not say what was tested — and when a run does
          # go red, the first question is always "against which kernel?".
          chan="${{ matrix.channel }}"
          set -o pipefail
          if make KVER="${krel}" KBUILD_MODPOST_WARN=1 -j"$(nproc)" 2>&1 | tee build-mainline.log && test -f 8852au.ko; then
            echo "Module built successfully against ${ver}."
            modinfo ./8852au.ko | grep -E "vermagic|^version" || true
            echo "✅ **\`${chan}\`** — builds against Linux \`${ver}\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$chan" = "stable" ]; then
            # Newest-stable is a forward-looking probe: report loudly, but do
            # not fail the job — otherwise every branch shows a red X for a
            # known limitation.
            echo "::warning title=Newest stable ${ver} does not build::The driver does not compile against the newest mainline stable (${ver}). Informational early warning, not a regression gate — see the build log above."
            {
              echo "### ⚠️ Newest stable \`${ver}\` does not build"
              echo "Informational early warning: the driver does not yet support this kernel. Not a regression gate."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=LTS ${ver} does not build::The driver failed to build against the longterm/LTS kernel ${ver}."
            echo "### ❌ Longterm \`${ver}\` does not build" >> "$GITHUB_STEP_SUMMARY"
            echo "This is a regression gate — the LTS kernel must build." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ── DKMS install/remove dry-run (validates the helper scripts) ─────────
  #
  # Deliberately not `needs: build`. Nothing here consumes what that job
  # produces -- dkms-install.sh strips *.ko and *.o out of the tree it copies,
  # and `dkms build` recompiles from source -- so the edge only ever ordered the
  # two, and it put the repository's only shellcheck run behind an apt step on
  # somebody else's runner. In run 32161189076 a stalled mirror killed the
  # ubuntu-22.04 build at 16:56:45 and this job was skipped in the same second;
  # a job skipped by an unmet `needs` reports success, so a required check went
  # green having never run. Nothing that did not run should look like it passed.
  dkms:
    name: DKMS scripts dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install deps
        run: |
          .github/scripts/apt-install.sh \
            build-essential dkms xz-utils "linux-headers-$(uname -r)" shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck dkms-install.sh dkms-remove.sh tests/run_tests.sh \
            .github/scripts/apt-install.sh

      - name: Install via DKMS
        run: sudo ./dkms-install.sh

      - name: DKMS status
        run: dkms status | grep rtl8852au

      - name: Remove via DKMS
        run: sudo ./dkms-remove.sh

      - name: Verify clean state
        # Do not add pipefail to this step. `grep -q` exits on the first match,
        # so `dkms status` takes SIGPIPE and the pipeline returns 141 rather
        # than 0: the `if` goes false and the gate stops firing exactly when it
        # has something to catch. Safe at today's one or two DKMS entries, but
        # it fails open, not shut, once the runner image carries more.
        run: |
          if dkms status | grep -q rtl8852au; then
            echo "::error::DKMS entry still present after remove"
            exit 1
          fi

  # ── Python lint + offline tests ────────────────────────────────────────
  python:
    name: Python lint and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          # Runtime deps for dashboard: hash-locked.
          pip install --require-hashes -r dashboard/requirements.txt
          # Dev tools (lint): pinned by major to keep CI hermetic.
          pip install 'ruff~=0.14' 'pyflakes~=3.2'

      - name: Ruff (lint)
        run: |
          ruff check dashboard tests

      - name: Pyflakes
        run: |
          pyflakes dashboard tests || true  # informational

      - name: Compile-check dashboard and tests
        run: |
          python -m py_compile dashboard/app.py
          python -m py_compile tests/test_driver.py

      - name: Run test discovery (no hardware)
        run: |
          # Verify the test suite imports and discovers tests cleanly.
          python -c "import tests.test_driver; print('OK:', len([c for c in dir(tests.test_driver) if c.startswith('Test')]), 'test classes')"

      - name: Run offline unit tests (no hardware)
        run: |
          # TestSysfsParsing is pure parsing logic with no hardware or root
          # requirement, so CI can actually run it rather than just import it.
          # It pins how a bound USB interface is spelled in sysfs (hub port
          # paths are dot-separated) and how a compressed DKMS module is
          # handled — both regressed silently before, because every other test
          # in this suite needs an adapter to say anything at all.
          python -m unittest tests.test_driver.TestSysfsParsing -v
