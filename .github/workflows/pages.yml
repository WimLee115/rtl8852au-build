name: Deploy Pages

# Publishes the static site in docs/ to GitHub Pages via the official
# Pages deployment (NOT Jekyll — the artifact is served verbatim, so
# docs/.nojekyll is belt-and-suspenders here). One-time setup: in
# Settings → Pages, set "Build and deployment → Source" to "GitHub Actions".
on:
  push:
    branches: [main]
    # Only redeploy when the site (or this workflow) actually changes.
    # Remove this paths filter to redeploy on every push to main.
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: read the repo, write Pages, and mint the
# OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; let an in-flight deploy finish
# rather than cancelling it half-published.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Package docs/ into a Pages artifact ────────────────────────────────
  build:
    name: Build Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Sanity-check the site
        run: |
          test -f docs/index.html || { echo "::error::docs/index.html is missing"; exit 1; }
          echo "Publishing $(find docs -type f | wc -l) files from docs/:"
          find docs -maxdepth 1 -type f -printf '  %P\n'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs

  # ── Deploy the artifact to the github-pages environment ────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
